version: '3.8'
services:

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: backend_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/rag_database
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    depends_on:
      - mongodb
      - ollama

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    restart: always
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  mongodb:
    image: mongo:6.0
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongo_data:
  ollama_data: